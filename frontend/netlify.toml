[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# ---------------------------------------------------------------
# Old WordPress URLs -> new pages (permanent 301 redirects).
# The old site used trailing slashes, so each page is listed both ways.
# Source of the list: Google Analytics landing-page / page reports
# (15 Sep - 12 Oct 2026 vs 18 Aug - 14 Sep 2026).
# These MUST stay above the catch-all rule at the bottom.
# ---------------------------------------------------------------

[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/contact-us/"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/about-us"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/about-us/"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/events"
  to = "/class-schedule"
  status = 301
  force = true

[[redirects]]
  from = "/events/"
  to = "/class-schedule"
  status = 301
  force = true

[[redirects]]
  from = "/fascial-release-therapy"
  to = "/services/fascia-release"
  status = 301
  force = true

[[redirects]]
  from = "/fascial-release-therapy/"
  to = "/services/fascia-release"
  status = 301
  force = true

[[redirects]]
  from = "/online-teacher-training"
  to = "/teacher-training"
  status = 301
  force = true

[[redirects]]
  from = "/online-teacher-training/"
  to = "/teacher-training"
  status = 301
  force = true

[[redirects]]
  from = "/teacher-workshops"
  to = "/teacher-training"
  status = 301
  force = true

[[redirects]]
  from = "/teacher-workshops/"
  to = "/teacher-training"
  status = 301
  force = true

# Old dated blog posts (/2024/02/08/...), categories and tags -> blog index

[[redirects]]
  from = "/2022/*"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/2023/*"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/2024/*"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/2025/*"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/category/*"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/tag/*"
  to = "/blog"
  status = 301
  force = true

# Single-page app fallback: serve the React app for every route that has no
# pre-rendered page of its own (blog posts, admin, checkout...).
[[redirects]]
  from = "/*"
  to = "/app-shell.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css"
